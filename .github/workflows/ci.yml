name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate

  terraform-tests:
    name: Terraform tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"

      - name: Initialize Terraform without backend
        run: terraform init -backend=false

      - name: Run native Terraform tests
        run: terraform test

  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r app/requirements-dev.txt

      - name: Lint Python
        run: python -m ruff check app

      - name: Check Python dependencies
        run: python -m pip check

      - name: Run Python tests
        run: python -m pytest app

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0

      - name: Lint root module and child modules
        run: tflint --recursive --config "${GITHUB_WORKSPACE}/.tflint.hcl"

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  trivy:
    name: Trivy security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build local FastAPI image for scanning
        run: docker build --pull --no-cache --tag terraform-docker-lab-api:ci ./app

      - name: Scan Terraform and Dockerfile IaC
        id: trivy-config
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-config.sarif
          limit-severities-for-sarif: true
          version: v0.70.0

      - name: Scan repository dependencies and secrets
        id: trivy-fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          version: v0.70.0

      - name: Scan local FastAPI image
        id: trivy-image
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: terraform-docker-lab-api:ci
          scanners: vuln
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true
          version: v0.70.0

      - name: Upload IaC SARIF
        if: ${{ always() && (github.event_name == 'push' || github.event.pull_request.head.repo.fork == false) && hashFiles('trivy-config.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Upload image SARIF
        if: ${{ always() && (github.event_name == 'push' || github.event.pull_request.head.repo.fork == false) && hashFiles('trivy-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Enforce Trivy thresholds
        if: ${{ always() && (steps.trivy-config.outcome == 'failure' || steps.trivy-fs.outcome == 'failure' || steps.trivy-image.outcome == 'failure') }}
        run: exit 1
